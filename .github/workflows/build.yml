name: Build

# Reusable workflow behind every package and combo repository. Callers use
# the caller workflow from the ci README and grant the permissions listed
# there; each job below narrows them again.

on:
  workflow_call:
    inputs:
      default-only:
        description: Rebuild only the default image on top of the published slim image
        type: boolean
        default: false
      want:
        description: Request id set by the reconciler
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
      merge-matrix: ${{ steps.plan.outputs.merge-matrix }}
    steps:
      # rc always comes from the same ci commit as this workflow file.
      - name: Check out ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rc
          persist-credentials: false
      - name: Set up rc
        uses: ./.rc/setup-rc
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      # hadolint reads the repository's .hadolint.yaml from its working
      # directory. A combo repository is linted as committed; the Dockerfile
      # the plan renders from package.yml is linted by ci's own tests.
      - name: Lint Dockerfiles
        working-directory: src
        run: |
          shopt -s nullglob
          files=(Dockerfile.*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::no Dockerfile.* in the repository"
            exit 1
          fi
          docker run --rm --network none -v "$PWD:/src:ro" -w /src \
            hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint "${files[@]}"
      - name: Plan
        id: plan
        env:
          DEFAULT_ONLY: ${{ inputs.default-only }}
          WANT: ${{ inputs.want }}
        run: rc plan --source src --default-only "$DEFAULT_ONLY" --want "$WANT" --output-file "$RUNNER_TEMP/plan.json"
      # The plan reaches the other jobs as an artifact, not a job output: the
      # runner drops an output it takes for a secret, and the plan carries
      # free text such as test commands.
      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.distro }} ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # push by digest, only after the tests pass
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DISTRO: ${{ matrix.distro }}
      PLATFORM: ${{ matrix.platform }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - name: Check out ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rc
          persist-credentials: false
      - name: Set up rc
        uses: ./.rc/setup-rc
      - name: Check out repository
        if: needs.plan.outputs.kind == 'package'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Build for testing
        run: |
          rc bake --plan "$RUNNER_TEMP/plan.json" --distro "$DISTRO" --platform "$PLATFORM" --mode load --output .rc-build/bake-load.json
          docker buildx bake --file .rc-build/bake-load.json --metadata-file .rc-build/meta-load.json --progress plain build
      - name: Check slim image
        if: matrix.slim
        run: rc check-image --plan "$RUNNER_TEMP/plan.json" --target slim --distro "$DISTRO"
      - name: Test slim image
        if: matrix.slim
        run: rc test-image --plan "$RUNNER_TEMP/plan.json" --target slim --distro "$DISTRO" --work-dir "$RUNNER_TEMP/tests"
      - name: Check default image
        if: matrix.default
        run: rc check-image --plan "$RUNNER_TEMP/plan.json" --target default --distro "$DISTRO"
      - name: Test default image
        if: matrix.default
        run: rc test-image --plan "$RUNNER_TEMP/plan.json" --target default --distro "$DISTRO" --work-dir "$RUNNER_TEMP/tests"
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: env.PUBLISH == 'true'
        run: |
          rc bake --plan "$RUNNER_TEMP/plan.json" --distro "$DISTRO" --platform "$PLATFORM" --mode push --output .rc-build/bake-push.json
          docker buildx bake --file .rc-build/bake-push.json --metadata-file .rc-build/meta-push.json --progress plain build
          rc digests --plan "$RUNNER_TEMP/plan.json" --distro "$DISTRO" --platform "$PLATFORM" \
            --push-metadata .rc-build/meta-push.json --load-metadata .rc-build/meta-load.json \
            --output-dir "$RUNNER_TEMP/digests"
      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.flavour }} ${{ matrix.distro }}
    needs: [plan, build]
    # Runs even when another distro failed; rc merge publishes a distro only
    # when every platform of it was pushed.
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # read the head of main
      packages: write # create the index and tags
      id-token: write # sign the attestation
      attestations: write # store the attestation
      artifact-metadata: write # record the image as an artifact of this run
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.merge-matrix) }}
    env:
      FLAVOUR: ${{ matrix.flavour }}
      DISTRO: ${{ matrix.distro }}
    steps:
      - name: Check out ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rc
          persist-credentials: false
      - name: Set up rc
        uses: ./.rc/setup-rc
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.distro }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide tags
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_REGISTRY_USER: ${{ github.actor }}
          RC_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          rc merge --plan "$RUNNER_TEMP/plan.json" --flavour "$FLAVOUR" --distro "$DISTRO" \
            --digests "$RUNNER_TEMP/digests" --output "$RUNNER_TEMP/imagetools.args"
      - name: Create index
        id: index
        if: steps.decide.outputs.skip == 'false'
        env:
          REF: ${{ steps.decide.outputs.ref }}
        run: |
          mapfile -d '' -t args < "$RUNNER_TEMP/imagetools.args"
          docker buildx imagetools create "${args[@]}"
          digest="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::unexpected index digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "- \`$REF@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest
        if: steps.decide.outputs.skip == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.decide.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: false

  release:
    name: Source release
    needs: [plan, merge]
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.merge.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Check out ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rc
          persist-credentials: false
      - name: Set up rc
        uses: ./.rc/setup-rc
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Download and verify source
        id: source
        run: rc source-release --plan "$RUNNER_TEMP/plan.json" --output-dir "$RUNNER_TEMP/source"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.source.outputs.tag }}
          TITLE: ${{ steps.source.outputs.title }}
          NOTES: ${{ steps.source.outputs.notes }}
        # Only missing files are uploaded. When a rebuild of the same version
        # adds one, for example a new extra artifact, the notes are rewritten
        # to list the files of this build.
        run: |
          created=false
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TITLE" --notes-file "$NOTES"
            created=true
          fi
          existing="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          added=false
          for file in "$RUNNER_TEMP"/source/assets/*; do
            name="$(basename "$file")"
            if grep -Fxq -- "$name" <<< "$existing"; then
              echo "$name is already attached"
            else
              gh release upload "$TAG" "$file" --repo "$REPO"
              added=true
            fi
          done
          if [[ "$created" == false && "$added" == true ]]; then
            gh release edit "$TAG" --repo "$REPO" --notes-file "$NOTES"
          fi

  scan:
    name: Scan ${{ matrix.flavour }} ${{ matrix.distro }}
    needs: [plan, merge]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # packages stay private until they are made public
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.merge-matrix) }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan with Grype
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.ref }}
          fail-build: false
          output-format: sarif
      - name: Upload results
        if: steps.grype.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-${{ matrix.flavour }}-${{ matrix.distro }}
